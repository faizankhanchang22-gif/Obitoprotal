<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure System</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a0a14;color:#fff;height:100vh;display:flex;justify-content:center;align-items:center}
        .login-box{background:rgba(30,30,40,0.95);padding:40px;border-radius:15px;text-align:center;width:90%;max-width:400px;border:1px solid rgba(255,100,0,0.3)}
        .login-box h2{color:#ff6600;margin-bottom:20px}
        input{width:100%;padding:12px;margin-bottom:20px;border:2px solid rgba(255,100,0,0.3);background:rgba(0,0,0,0.3);border-radius:8px;color:white}
        button{width:100%;padding:12px;background:#ff6600;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
        .error{color:#ff4757;margin-top:10px}
        .portal{display:none;width:90%;max-width:1200px;background:rgba(30,30,40,0.95);padding:30px;border-radius:15px;max-height:80vh;overflow-y:auto}
        .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:30px}
        .tool-card{background:rgba(40,40,50,0.7);padding:20px;border-radius:10px;border:1px solid rgba(255,100,0,0.2)}
        .tool-card h3{color:#ff9900;margin-bottom:15px}
        .tool-link{display:block;background:rgba(255,255,255,0.05);padding:10px;margin:8px 0;border-radius:6px;color:#fff;text-decoration:none}
        .tool-link:hover{background:rgba(255,100,0,0.2)}
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h2>🔐 SECURE SYSTEM</h2>
        <input type="password" id="password" placeholder="Enter access code">
        <button onclick="checkAccess()">ACCESS</button>
        <div class="error" id="error"></div>
    </div>
    
    <div class="portal" id="portal">
        <h2 style="color:#ff6600;text-align:center;margin-bottom:30px">🛠️ TOOLS PORTAL</h2>
        <input type="text" placeholder="Search tools..." oninput="searchTools(this.value)" style="width:100%;padding:12px;margin-bottom:30px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,100,0,0.3);border-radius:8px;color:white">
        
        <div class="tools-grid" id="toolsGrid"></div>
        
        <button onclick="logout()" style="margin-top:30px;background:#ff4757">LOGOUT</button>
    </div>

<script>
// Hidden passwords (hex encoded)

    ['aHR0cHM6Ly9vYml0b3Ntc2JvbWJlci52ZXJjZWwu', 'YXBw'],

    ['aHR0cHM6Ly93d3cubWVkaWFmaXJlLmNvbS9maWxlL3', 'l0Z3RicjA5cXF5dGh2ZWIvVElLX1RPS19MSVZFXyUyNTdDX01IX1RFQ0guYXBrL2ZpbGU='],
    ['aHR0cHM6Ly93d3cubWVkaWFmaXJlLmNvbS9mb2xkZXIvb', 'TBiYWIyd2Rjc21kNi9UaWtUb2srVW5saW1pdGVkK2xpa2Vz'],
    ['aHR0cHM6Ly9mYWNlYm9vay1yZXBvcnRzLnZlcmNlbC5hcHAv'],

    ['aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2RyaXZlL2ZvbGRlcnMv', 'MTNmWk4yZDNXMlAzUmdTMHFBcnpMNE9IcGZ6TmJLb3hROQ=='],
    ['aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2RyaXZlL2ZvbGRlcnMvM', 'URUNWNvaHB3SlBzT05tQllUMzFJTnUwN05xNWdfTlVV'],
    ['aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2RyaXZlL2ZvbGRlcnMvM', 'UxWaFJYUVZYMlRJcV9YdkxmY1JqTU5OTzQza3h0M0lN'],

    ['aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2RyaXZlL2ZvbGRlcnMvM', 'Ud6YjJBTGdVVEFwOVVzSF9zYVpEZE9PX3Foa01vMURH'],

    ['aHR0cHM6Ly9kcml2ZS5nb29nbGUuY29tL2RyaXZlL21vYmlsZS9mb2xkZXJzLz', 'FCaFVQOGFnTmVoQkgxQU9keE9YeVBKTTVDZC1RRURHdw==']
];

// Tool data
var tools = [
    {name: "Downloader", category: "🔧 Tools"},
    {name: "Image Maker", category: "🔧 Tools"},
    {name: "Database", category: "🔧 Tools"},
    {name: "SMS Bomber", category: "🔧 Tools"},
    {name: "Social Downloader", category: "🔧 Tools"},
    {name: "TikTok Live APK", category: "📱 Social"},
    {name: "TikTok Likes", category: "📱 Social"},
    {name: "FB Report Tool", category: "📱 Social"},
    {name: "FB Ban Methods", category: "📱 Social"},
    {name: "Unlimited Gmail", category: "📧 Email"},
    {name: "YouTube Course", category: "🎓 Courses"},
    {name: "YouTube Automation", category: "🎓 Courses"},
    {name: "Fiverr Course", category: "💼 Earning"},
    {name: "Blogging Course", category: "💼 Earning"},
    {name: "Hacking Course", category: "🔐 Security"},
    {name: "Carding Course", category: "💳 Carding"}
];

// Convert text to hex
function toHex(text) {
    return text.split('').map(c => 
        c.charCodeAt(0).toString(16).padStart(2, '0')
    ).join('');
}

// Decode link chunks
function decodeLink(index) {
    if (linkChunks[index].length === 2) {
        return atob(linkChunks[index][0]) + atob(linkChunks[index][1]);
    } else {
        return atob(linkChunks[index][0]);
    }
}

// Check access
function checkAccess() {
    var input = document.getElementById('password').value;
    var inputHex = toHex(input);
    
    if (passwords.includes(inputHex)) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('portal').style.display = 'block';
        loadTools();
    } else {
        document.getElementById('error').textContent = '❌ Invalid code!';
        document.getElementById('password').value = '';
    }
}

// Load tools
function loadTools() {
    var grid = document.getElementById('toolsGrid');
    grid.innerHTML = '';
    
    // Group tools by category
    var categories = {};
    tools.forEach((tool, index) => {
        if (!categories[tool.category]) {
            categories[tool.category] = [];
        }
        categories[tool.category].push({name: tool.name, link: decodeLink(index)});
    });
    
    // Create category cards
    for (var category in categories) {
        var card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = '<h3>' + category + '</h3>';
        
        categories[category].forEach(item => {
            var link = document.createElement('a');
            link.className = 'tool-link';
            link.href = item.link;
            link.target = '_blank';
            link.textContent = item.name;
            card.appendChild(link);
        });
        
        grid.appendChild(card);
    }
}

// Search tools
function searchTools(query) {
    var cards = document.querySelectorAll('.tool-card');
    query = query.toLowerCase();
    
    cards.forEach(card => {
        var text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? 'block' : 'none';
    });
}

// Logout
function logout() {
    document.getElementById('portal').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('password').value = '';
    document.getElementById('error').textContent = '';
}

// Enter key support
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkAccess();
});

// Security - disable right click
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

// Security - disable dev tools
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && ['I','J'].includes(e.key)) || 
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
    }
});
</script>
</body>
</html>
